components:
  schemas:
    abstractSearchRequest:
      type: object
      properties:
        expression:
          type: string
        expressionType:
          type: string
          enum:
            - CONTAINS
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
    pkgVersionType:
      description: >
        This type defines the versions that should be sent back in the result.  If the client were
        only interested in the latest version for example, then it should use the "LATEST" value.
      type: string
      enum:
        - ALL
        - LATEST
        - NONE
        - SPECIFIC
    jobStatus:
      type: string
      enum:
        - QUEUED
        - STARTED
        - FINISHED
        - FAILED
        - CANCELLED
    permission:
      type: string
      description: >
        This enumerated type defines a permission that can be queried against in the context of
        an authentication and an object such as a User, a Package or a Repository for example.
      enum:
        - REPOSITORY_VIEW
        - REPOSITORY_EDIT
        - REPOSITORY_IMPORT
        - REPOSITORY_LIST
        - REPOSITORY_LIST_INACTIVE
        - REPOSITORY_ADD

        - USER_VIEWJOBS
        - USER_VIEW
        - USER_EDIT
        - USER_CHANGEPASSWORD
        - USER_LIST
        - USER_AGREE_USAGE_CONDITIONS

        - AUTHORIZATION_CONFIGURE

        - USERRATING_EDIT
        - USERRATING_REMOVE
        - USERRATING_DERIVEANDSTOREFORPKG

        - PKG_CREATEUSERRATING
        - PKG_EDITICON
        - PKG_EDITSCREENSHOT
        - PKG_EDITCATEGORIES
        - PKG_EDITLOCALIZATION
        - PKG_EDITPROMINENCE
        - PKG_EDITCHANGELOG
        - PKG_EDITVERSION
        - PKG_EDITNATIVEDESKTOP

        - BULK_PKGCATEGORYCOVERAGEEXPORTSPREADSHEET
        - BULK_PKGCATEGORYCOVERAGEIMPORTSPREADSHEET
        - BULK_PKGPROMINENCEANDUSERRATINGSPREADSHEETREPORT
        - BULK_PKGVERSIONLOCALIZATIONCOVERAGEEXPORTSPREADSHEET
        - BULK_PKGLOCALIZATIONCOVERAGEEXPORTSPREADSHEET
        - BULK_PKGICONSPREADSHEETREPORT
        - BULK_PKGSCREENSHOTSPREADSHEETREPORT
        - BULK_PKGSCREENSHOTEXPORTARCHIVE
        - BULK_PKGSCREENSHOTIMPORTARCHIVE
        - BULK_PKGICONEXPORTARCHIVE
        - BULK_PKGICONIMPORTARCHIVE
        - BULK_USERRATINGSPREADSHEETREPORT_PKG
        - BULK_USERRATINGSPREADSHEETREPORT_ALL
        - BULK_USERRATINGSPREADSHEETREPORT_USER
        - BULK_PKGVERSIONPAYLOADDATAPOPULATION

        - JOBS_VIEW

        - SHUTDOWN_ALL_INSTANCES
